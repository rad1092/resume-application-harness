name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: skills/resume-application-harness/scripts/resuml-safe-mcp/package-lock.json
      - name: Test Korean application tools and harness
        run: npm test
      - name: Install locked optional MCP dependencies and test
        run: npm run test:resuml
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/resume-application-harness/scripts/resuml-safe-mcp/package-lock.json
      - name: Reject tracked dependency installations
        run: test -z "$(git ls-files | grep -E '(^|/)node_modules(/|$)' || true)"
      - name: Install locked dependencies without lifecycle scripts
        working-directory: skills/resume-application-harness/scripts/resuml-safe-mcp
        run: npm ci --ignore-scripts --omit=optional
      - name: Audit production dependencies
        working-directory: skills/resume-application-harness/scripts/resuml-safe-mcp
        run: npm audit --omit=dev --audit-level=high
